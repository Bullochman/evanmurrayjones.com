<script>

function abbr(n){
  if (n == null || isNaN(n)) return "–";
  const a = Math.abs(n);
  if (a >= 1e9) return (n/1e9).toFixed(a >= 1e10 ? 1 : 2).replace(/\.?0+$/,"") + "G";
  if (a >= 1e6) return (n/1e6).toFixed(1).replace(/\.0$/,"") + "M";
  if (a >= 1e4) return (n/1e3).toFixed(1).replace(/\.0$/,"") + "K";
  return Math.round(n).toLocaleString();
}
const full = n => n == null ? "–" : Number(n).toLocaleString();
// tolerant date parse: "2026-11-15 23:42", "2026-11-16 18:3x", ISO with or without offset
const pd = s => { if (!s) return null; const m = String(s).replace(/x/g,"0").match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?(.*)$/);
  if (!m) return null; const tz = (m[6] || "").match(/^(?::\d\d)?([+-]\d\d:\d\d|Z)/);
  const d = new Date(`${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}T${(m[4] || "12").padStart(2,"0")}:${m[5] || "00"}:00${tz ? tz[1] : ""}`);
  return isNaN(d) ? null : d; };
const fmtT = iso => { const d = pd(iso); return d ? d.toLocaleString([], {weekday:"short", hour:"numeric", minute:"2-digit"}) : ""; };
const fmtD = d => new Date(d + "T12:00:00").toLocaleDateString([], {month:"short", day:"numeric"});
const fmtDay = d => d.toLocaleDateString([], {weekday:"short", month:"short", day:"numeric"});
function ago(iso){
  const d = pd(iso); if (!d) return "";
  const m = Math.round((Date.now() - d) / 60000);
  if (m < 1) return "just now"; if (m < 60) return m + "m ago";
  const h = Math.floor(m/60); if (h < 48) return h + "h ago";
  return Math.floor(h/24) + "d ago";
}
function until(iso){
  const d = pd(iso); if (!d) return "–";
  let s = Math.round((d - Date.now()) / 1000);
  if (s <= 0) return "now";
  const dd = Math.floor(s/86400); s %= 86400;
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s % 60;
  return dd ? `${dd}d ${h}h` : h ? `${h}h ${String(m).padStart(2,"0")}m` : `${m}m ${String(sec).padStart(2,"0")}s`;
}
function dlt(d){
  if (d == null || isNaN(d)) return `<span class="flat">—</span>`;
  const cls = d > 0 ? "up" : d < 0 ? "down" : "flat";
  return `<span class="${cls}">${d > 0 ? "+" : d < 0 ? "−" : "±"}${abbr(Math.abs(d))}</span>`;
}

async function getJSON(path){
  const r = await fetch(BASE + path + "?c=" + encodeURIComponent(code), {cache:"no-store"});
  if (r.status === 403) throw Object.assign(new Error("code"), {status: 403});
  if (!r.ok) throw new Error("http " + r.status);
  return r.json();
}
async function load(){
  if (!code) return gate("");

  catch (e) { return gate(e.status === 403 ? "That access code didn't work." : "Couldn't reach the server. Try again."); }
  const [c, r] = await Promise.allSettled([getJSON("/comms"), getJSON("/inbox")]);
  C = c.status === "fulfilled" ? c.value : null;
  R = r.status === "fulfilled" ? (r.value.requests || []) : [];
  render();
}

const RANGES = {"LAST":0,"1H":1,"6H":6,"24H":24,"7D":168};
function baseline(a, key, range){
  const now = a.current?.[key]; if (now == null) return null;
  const samples = (a.samples || []).filter(s => s[key] != null);
  if (range === "LAST") { const p = samples[samples.length-2]; return p ? p[key] : null; }
  const t0 = (pd(a.updated_at) || new Date()) - RANGES[range] * 3.6e6;
  if (range !== "7D" && samples.length && pd(samples[0].at) <= t0) {
    let b = null; for (const s of samples) { if (pd(s.at) <= t0) b = s[key]; } return b;
  }
  const h = (a.history || []).filter(x => x[key] != null && new Date(x.date + "T23:59:00") <= t0);
  if (h.length) return h[h.length-1][key];
  const h0 = (a.history || []).find(x => x[key] != null);
  return h0 ? h0[key] : null;
}

const CHARTS = [["power","Power"],["food","Food"],["iron","Iron"],["coin","Coin"],["oil","Oil"],["diamonds","Diamonds"],["stars","★ Tokens"],["stamina","Stamina"]];
function chart(hist, key, label){
  const pts = hist.filter(h => h[key] != null).map(h => ({d:h.date, v:h[key]}));
  if (!pts.length) return "";
  const W = 300, H = 96, T = 8, B = 18;
  const vs = pts.map(p => p.v); let lo = Math.min(...vs), hi = Math.max(...vs);
  if (lo === hi){ lo -= Math.abs(lo)*0.01 || 1; hi += Math.abs(hi)*0.01 || 1; }
  const pad = (hi - lo) * 0.12; lo -= pad; hi += pad;
  const x = i => pts.length === 1 ? W/2 : 4 + i * (W - 8) / (pts.length - 1);
  const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const path = pts.map((p,i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
  const last = pts[pts.length-1], prev = pts.length > 1 ? pts[pts.length-2] : null;
  return `<div class="chart" data-key="${key}"><div class="t"><span class="muted">${label}</span><span><b class="num">${abbr(last.v)}</b> ${prev ? dlt(last.v - prev.v) : ""}</span></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${label} per day">
      <path class="ar" d="${path}L${x(pts.length-1)},${H-B}L${x(0)},${H-B}Z"/><path class="ln" d="${path}" vector-effect="non-scaling-stroke"/>
      ${pts.map((p,i) => `<circle class="pt" cx="${x(i)}" cy="${y(p.v)}" r="3.5" vector-effect="non-scaling-stroke"/>`).join("")}
      <line class="cross" x1="0" x2="0" y1="${T}" y2="${H-B}" style="display:none" vector-effect="non-scaling-stroke"/>
      ${(pts.length > 1 ? [0, pts.length-1] : [0]).map(i => `<text class="ax" x="${x(i)}" y="${H-4}" text-anchor="${i ? "end" : "start"}">${fmtD(pts[i].d)}</text>`).join("")}
    </svg><div class="tip"></div></div>`;
}
function wireCharts(root, hist){
  root.querySelectorAll(".chart").forEach(el => {
    const key = el.dataset.key, svg = el.querySelector("svg"), tip = el.querySelector(".tip"), cross = el.querySelector(".cross");
    const pts = hist.filter(h => h[key] != null);
    const move = e => {
      const r = svg.getBoundingClientRect(), cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
      const i = pts.length === 1 ? 0 : Math.max(0, Math.min(pts.length-1, Math.round((cx/r.width*300 - 4) / (292/(pts.length-1)))));
      const p = pts[i], px = pts.length === 1 ? 150 : 4 + i*292/(pts.length-1);
      cross.setAttribute("x1", px); cross.setAttribute("x2", px); cross.style.display = "";
      tip.innerHTML = `<b>${fmtD(p.date)}</b> · ${key === "power" ? full(p[key]) : abbr(p[key])} ${i ? dlt(p[key] - pts[i-1][key]) : ""}`;
      tip.style.display = "block";
      tip.style.left = Math.min(Math.max(px/300*r.width + 12 - tip.offsetWidth/2, 0), el.clientWidth - tip.offsetWidth) + "px"; tip.style.top = "22px";
    };
    const out = () => { tip.style.display = "none"; cross.style.display = "none"; };
    svg.addEventListener("mousemove", move); svg.addEventListener("touchstart", move, {passive:true});
    svg.addEventListener("touchmove", move, {passive:true}); svg.addEventListener("mouseleave", out);
  });
}

      <div class="bb">${m.reply ? `<div class="q">↪ ${esc(m.reply)}</div>` : ""}${esc(m.text)}${m.en ? `<div class="en">${esc(m.en)}</div>` : ""}</div></div>`;
  }).join("");
  const posts = (t.your_posts || []).length ? `<details class="more" style="margin-bottom:10px"><summary>Your recent World questions</summary><ul class="starters">${t.your_posts.map(p => `<li>${esc(p.text)} <span class="dim small">${ago(p.at)}</span></li>`).join("")}</ul></details>` : "";
  return `<div class="ch-h"><h2><button class="iconbtn back" id="back">${I("chev")}</button>${esc(t.label)}${t.tag ? ` <span class="tag ${tagCls(t.tag)}">${esc(t.tag)}</span>` : ""}</h2>
    <span style="display:flex;gap:8px;align-items:center">${t.needs_reply ? `<span class="pill p-acc">needs reply</span>` : `<span class="pill p-good">caught up</span>`}
    ${t.kind !== "channel" ? `<button class="btn" id="replyto" data-to="${esc(t.person || t.label)}" style="padding:7px 12px">Reply…</button>` : ""}</span></div>
    ${posts}<div class="convo">${ms || `<div class="empty">No messages.</div>`}</div>
    <div class="small dim" style="margin-top:8px">${t.count} messages${t.count > (t.messages || []).length ? `, latest ${(t.messages || []).length} shown` : ""}</div>`;
}
function wireInbox(){
  document.querySelectorAll("[data-if]").forEach(b => b.onclick = () => { UI.ifilter = b.dataset.if; render(); });
  document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { UI.thread = b.dataset.t; render(); if (innerWidth <= 900) document.querySelector(".convc")?.scrollIntoView(); });
  const bk = document.getElementById("back"); if (bk) bk.onclick = () => { UI.thread = null; render(); };
  const ta = document.getElementById("req"), sel = document.getElementById("reqto");
  ta.oninput = () => { UI.draft = ta.value; };
  sel.onchange = () => { UI.draftTo = sel.value; };
  const rt = document.getElementById("replyto");
  if (rt) rt.onclick = () => { const to = rt.dataset.to;
    if ([...sel.options].some(o => o.value === to)) { sel.value = to; UI.draftTo = to; }
    ta.value = UI.draft = `Reply to ${to}: `; ta.focus(); ta.scrollIntoView({behavior:"smooth", block:"center"}); };
  const send = document.getElementById("sendreq");
  send.onclick = async () => {
    const text = ta.value.trim(); if (!text) { toast("Type a request first"); return; }
    send.disabled = true; document.getElementById("reqmsg").textContent = "Sending…";
    try {
      const r = await fetch(BASE + "/inbox", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({c: code, text, to: sel.value})});
      const j = await r.json(); if (!r.ok) throw new Error(j.error || "failed");
      R.unshift(j.request); UI.draft = ""; UI.draftTo = ""; toast("Request sent"); render();
    } catch (e) { send.disabled = false; document.getElementById("reqmsg").textContent = "Couldn't send: " + e.message; }
  };
}

/* ---------- merger ---------- */
function mergerPage(){
  const M = C?.merger;
  if (!M) return `<section class="card empty">The merger board isn't available right now.</section>`;
  const k = M.counts, tot = k.moved + k.waiting + k.not_coming + k.not_seated;
  const G = [["moved","Moved","var(--good)","p-good"],["waiting","Waiting","var(--warn)","p-warn"],["not_coming","Not coming","var(--bad)","p-bad"],["not_seated","Not seated","var(--ink-3)","p-mute"]];
  return `<section class="card hot"><div class="ch-h"><h2>${I("merge")}DDI → [12AM] MidNight</h2><span class="pill p-mute">board v${esc(M.version)}</span></div>
    <div class="mtiles">${G.map(([key, l, col]) => `<div class="mt"><div class="lbl">${l}</div><div class="n num" style="color:${col}">${k[key]}</div></div>`).join("")}</div>
    <div class="seatbar">${G.map(([key, , col]) => `<i style="width:${tot ? k[key]/tot*100 : 0}%;background:${col}"></i>`).join("")}</div>
    <div class="small muted">${M.seated}/${M.cap} seats filled on the board · ${M.twelve_am_seated} from 12AM · ${Math.max(0, M.cap - M.seated)} open</div></section>
    <div class="grid g2">${G.map(([key, l, , pc]) => `<section class="card"><div class="ch-h"><h2>${l}</h2><span class="pill ${pc}">${k[key]}</span></div>
      <div class="mlist">${(M.groups[key] || []).map(p => `<div><b>${esc(p.name)}</b> <span class="dim small">${esc(p.rank || "")}${p.power ? " · " + abbr(p.power) : ""}</span><div class="small muted">${esc(p.note || "")}</div></div>`).join("") || `<div class="empty">None</div>`}</div></section>`).join("")}</div>
    <section class="card"><div class="ch-h"><h2>${I("pulse")}Board changes</h2></div><ul class="rows">${(M.log || []).map(e => `<li><span class="rt"><b>${esc(e.name || "")}</b> <span class="muted">${esc(e.to || "")}</span><div class="s">by ${esc(e.who || "")}</div></span><span class="small dim" style="white-space:nowrap">${ago(e.at)}</span></li>`).join("")}</ul>
    ${(M.comments || []).length ? `<div class="lbl" style="margin:14px 0 6px">Board comments</div>${M.comments.map(c => `<div class="req"><div class="tx"><b>${esc(c.who)}</b> <span class="small dim">${ago(c.at)}</span><div class="small muted">${esc(c.text)}</div></div></div>`).join("")}` : ""}</section>`;
}

/* ---------- alliance activity ---------- */
const AD = () => acct().extra?.activity || null;
const scoreCol = v => v == null ? "var(--ink-3)" : v >= 70 ? "var(--good)" : v >= 40 ? "var(--warn)" : "var(--bad)";
const sbar = v => `<span class="sbar"><span class="trk"><span class="fill" style="display:block;width:${v == null ? 0 : Math.max(3, v)}%;background:${scoreCol(v)}"></span></span><b class="num" style="color:${scoreCol(v)}">${v ?? "–"}</b></span>`;
const bucket = m => m.days_since_seen == null ? "unknown" : m.inactive_3d || m.days_since_seen >= 3 ? "inactive" : m.days_since_seen >= 1 ? "quiet" : "active";
const seenTxt = m => m.last_seen_at ? ago(m.last_seen_at) : (m.last_seen || "–");
function actLine(x){
  if (!x) return "";
  const b = bucket(x), pill = {active:["Active","p-good"], quiet:["Quiet 1–3 days","p-warn"], inactive:["Inactive 3+ days","p-bad"], unknown:["No reading","p-mute"]}[b];
  return `<div class="actl"><span class="lbl">Activity</span>${sbar(x.activity_score)}<span>last seen ${esc(seenTxt(x))}</span>
    ${b !== "active" ? `<span class="pill ${pill[1]}">${pill[0]}</span>` : ""}</div>
    ${x.current === false && x.as_of ? `<div class="small dim" style="margin-top:-6px">from the old alliance list, ${esc(fmtT(x.as_of))}</div>` : ""}`;
}
function allianceCounts(D){
  const ms = D.members || [];
  return {all: ms.length, active: ms.filter(m => bucket(m) === "active").length, quiet: ms.filter(m => bucket(m) === "quiet").length,
    inactive: ms.filter(m => bucket(m) === "inactive").length};
}
function allianceSnap(){
  const D = AD(); if (!D || !(D.members || []).length) return "";
  const k = allianceCounts(D), low = (D.members || []).filter(m => m.activity_score != null).slice().sort((x, y) => x.activity_score - y.activity_score).slice(0, 5);
  return `<section class="card"><div class="ch-h"><h2>${I("people")}Alliance activity</h2><a class="link" href="#alliance">All ${k.all} members ›</a></div>
    <div class="mtiles" style="grid-template-columns:repeat(3,minmax(0,1fr))">
      <div class="mt"><div class="lbl">Active 24h</div><div class="n num" style="color:var(--good)">${k.active}</div></div>
      <div class="mt"><div class="lbl">Quiet 1–3 days</div><div class="n num" style="color:var(--warn)">${k.quiet}</div></div>
      <div class="mt"><div class="lbl">Inactive 3+ days</div><div class="n num" style="color:var(--bad)">${k.inactive}</div></div></div>
    ${low.length ? `<div class="lbl" style="margin:14px 0 4px">Least active</div><ul class="rows">${low.map(m => `<li><span class="rt"><b>${esc(m.name)}</b> <span class="small dim">${esc(m.rank || "")}</span><div class="s">last seen ${esc(seenTxt(m))}</div></span>${sbar(m.activity_score)}</li>`).join("")}</ul>` : ""}
  </section>`;
}
const MCOLS = [["name","Name"],["rank","Rank"],["power","Power"],["score","Activity"],["seen","Last seen"]];
function allianceRows(D){
  const q = UI.mq.toLowerCase();
  const val = (m, k) => k === "name" ? m.name.toLowerCase() : k === "rank" ? (m.rank || "R0") : k === "power" ? (m.power || 0)
    : k === "score" ? (m.activity_score ?? -1) : (m.last_seen_at || "");
  return (D.members || []).filter(m => (UI.mfilter === "all" || bucket(m) === UI.mfilter) && (!q || m.name.toLowerCase().includes(q)))
    .sort((x, y) => { const a = val(x, UI.msort), b = val(y, UI.msort); return (a < b ? -1 : a > b ? 1 : 0) * UI.mdir || x.name.localeCompare(y.name); });
}
const allianceTable = rows => `<table class="atbl"><tr>${MCOLS.map(([k, l]) => `<th data-ms="${k}" class="${UI.msort === k ? "on" : ""} ${k === "rank" || k === "power" ? "hide-s" : ""}">${l}${UI.msort === k ? (UI.mdir > 0 ? " ▴" : " ▾") : ""}</th>`).join("")}</tr>
  ${rows.map(m => `<tr><td class="nm" title="${esc(m.name)}">${esc(m.name)}</td><td class="hide-s">${esc(m.rank || "–")}</td><td class="hide-s">${abbr(m.power)}</td>
    <td class="sc">${sbar(m.activity_score)}</td><td><span style="color:${{active:"var(--ink)", quiet:"var(--warn)", inactive:"var(--bad)"}[bucket(m)] || "var(--ink-3)"}">${esc(seenTxt(m))}</span></td></tr>`).join("") || `<tr><td colspan="5" class="empty">No one matches.</td></tr>`}</table>`;
function alliancePage(){
  const D = AD();
  if (!D || !(D.members || []).length) return `<section class="card empty">No member list readings yet.</section>`;
  const k = allianceCounts(D);
  const F = [["all","All",k.all],["active","Active 24h",k.active],["quiet","Quiet 1–3 days",k.quiet],["inactive","Inactive 3+ days",k.inactive]];
  return `<section class="card hot"><div class="mtiles">
      <div class="mt"><div class="lbl">Members</div><div class="n num">${k.all}</div></div>
      <div class="mt"><div class="lbl">Active 24h</div><div class="n num" style="color:var(--good)">${k.active}</div></div>
      <div class="mt"><div class="lbl">Quiet 1–3 days</div><div class="n num" style="color:var(--warn)">${k.quiet}</div></div>
      <div class="mt"><div class="lbl">Inactive 3+ days</div><div class="n num" style="color:var(--bad)">${k.inactive}</div></div></div>
    <div class="small muted" style="margin-top:12px">Member list last read ${D.last_check ? `${fmtT(D.last_check)} (${ago(D.last_check)})` : "—"} · score uses the last ${D.window_checks || "?"} readings: online or seen within 1h counts most, then 6h, then 24h.</div></section>
    <section class="card"><div class="toolbar"><input class="search" id="mq" type="search" placeholder="Find a member…" value="${esc(UI.mq)}"></div>
      <div class="chips" style="margin-bottom:6px">${F.map(([v, l, n]) => `<button class="chip ${UI.mfilter === v ? "on" : ""}" data-mf="${v}">${l} <span class="dim">${n}</span></button>`).join("")}</div>
      <div class="tbl" id="mtbl">${allianceTable(allianceRows(D))}</div></section>`;
}
function wireAlliance(){
  const wireSort = () => document.querySelectorAll("[data-ms]").forEach(th => th.onclick = () => {
    const k = th.dataset.ms; if (UI.msort === k) UI.mdir = -UI.mdir; else { UI.msort = k; UI.mdir = k === "name" ? 1 : -1; }
    document.getElementById("mtbl").innerHTML = allianceTable(allianceRows(AD())); wireSort(); });
  document.querySelectorAll("[data-mf]").forEach(b => b.onclick = () => { UI.mfilter = b.dataset.mf; render(); });
  const q = document.getElementById("mq");
  if (q) q.oninput = () => { UI.mq = q.value; document.getElementById("mtbl").innerHTML = allianceTable(allianceRows(AD())); wireSort(); };
  wireSort();
}

/* ---------- activity ---------- */
function activity(){
  const a = acct(), act = a.activity || [];
  const cats = [...new Set(act.map(x => x.cat))];
  const list = act.filter(x => (UI.acat === "all" || x.cat === UI.acat) && (UI.afilter === "all" || x.status === UI.afilter));
  const ic = {Combat:"sword", Resources:"wheat", "Train/Build":"hammer", Events:"cal"};
  return `${last24Card(a)}
    <section class="card"><div class="ch-h"><h2>${I("pulse")}Recent Activity</h2><span class="small dim">${act.length} actions in the last 24h</span></div>
    <div class="toolbar"><select class="sel" id="acat"><option value="all">All categories</option>${cats.map(c => `<option ${UI.acat === c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>
      <select class="sel" id="afil">${[["all","All statuses"],["done","Completed"],["idle","Nothing to do"],["attention","Needs a look"]].map(([v, l]) => `<option value="${v}" ${UI.afilter === v ? "selected" : ""}>${l}</option>`).join("")}</select></div>
    <ul class="rows">${list.map(x => `<li><span class="ri">${I(ic[x.cat] || "check")}</span><span class="rt"><b>${esc(x.task)}</b><div class="s">${esc(x.outcome)}</div></span>
      <span style="text-align:right">${stPill(x.status)}<div class="small dim" style="margin-top:3px">${ago(x.at)}</div></span></li>`).join("") || `<li class="empty">Nothing matches.</li>`}</ul></section>
    ${R.length ? `<section class="card"><div class="ch-h"><h2>${I("send")}Your requests</h2><a class="link" href="#inbox">New request ›</a></div>${R.slice(0, 10).map(reqRow).join("")}</section>` : ""}`;
}
function wireActivity(){
  document.getElementById("acat").onchange = e => { UI.acat = e.target.value; render(); };
  document.getElementById("afil").onchange = e => { UI.afilter = e.target.value; render(); };
}

setInterval(() => document.querySelectorAll("[data-until]").forEach(el => el.textContent = until(el.dataset.until)), 1000);
setInterval(() => { if (S && !document.hidden && !document.activeElement?.matches("textarea,input,select")) load(); }, 5 * 60000);
load();
</script>
</body>
