<style>
:root{
  color-scheme: dark;
  --page:#0a0c0f; --side:#07090b; --card:#111418; --card-2:#161a20; --card-3:#1b2028; --hair:#222833; --hair-2:#2c3340;
  --ink:#eef1f5; --ink-2:#9aa3af; --ink-3:#6b7480;
  --accent:#f26b4f; --accent-soft:rgba(242,107,79,.14); --glow:0 0 0 1px rgba(242,107,79,.35),0 0 24px rgba(242,107,79,.12);
  --good:#3fb950; --good-soft:rgba(63,185,80,.13); --bad:#f85149; --bad-soft:rgba(248,81,73,.13);
  --warn:#e3a008; --warn-soft:rgba(227,160,8,.14); --teal:#2dd4bf; --teal-soft:rgba(45,212,191,.12); --blue:#58a6ff;
  --gold:#d9a521; --grey-bar:#7d8794;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow-x:hidden;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .dim{color:var(--ink-3)} .small{font-size:12.5px}
.lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.shell{display:flex;min-height:100vh}
nav.side{width:224px;flex:none;background:var(--side);border-right:1px solid var(--hair);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:.5px;margin:0 8px 22px}
.brand .mk{width:30px;height:30px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#160805;box-shadow:0 0 18px rgba(242,107,79,.35)}
.brand .mk svg{width:16px;height:16px}

.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:var(--ink-2);text-decoration:none;font-weight:600;font-size:14.5px}
.nav svg{width:18px;height:18px;flex:none}
.nav:hover{background:var(--card);color:var(--ink)}
.nav.on{background:var(--accent);color:#fff;box-shadow:0 4px 18px rgba(242,107,79,.28)}
.nav .badge{margin-left:auto;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:700}
.nav.on .badge{background:#fff;color:var(--accent)}
.side .foot{margin-top:auto;padding:10px 12px;font-size:12px;color:var(--ink-3)}
main{flex:1;min-width:0;padding:22px 26px 60px;max-width:1380px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.top h1{margin:0;font-size:24px;font-weight:700}

.iconbtn{background:var(--card);border:1px solid var(--hair);border-radius:10px;padding:7px 10px;cursor:pointer;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;font-size:13px}
.iconbtn svg{width:14px;height:14px}
.iconbtn:hover{color:var(--ink);border-color:var(--hair-2)}
@media (max-width:900px){
  .shell{display:block}
  nav.side{position:sticky;top:0;z-index:20;width:auto;height:auto;flex-direction:row;padding:8px 10px;gap:4px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--hair);scrollbar-width:none}
  nav.side::-webkit-scrollbar{display:none}

}
.grid{display:grid;gap:16px;margin-bottom:16px}
.g2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}

.ch-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}

const CHARTS = [["power","Power"],["food","Food"],["iron","Iron"],["coin","Coin"],["oil","Oil"],["diamonds","Diamonds"],["stars","★ Tokens"],["stamina","Stamina"]];
function chart(hist, key, label){
  const pts = hist.filter(h => h[key] != null).map(h => ({d:h.date, v:h[key]}));
  if (!pts.length) return "";
  const W = 300, H = 96, T = 8, B = 18;
  const vs = pts.map(p => p.v); let lo = Math.min(...vs), hi = Math.max(...vs);
  if (lo === hi){ lo -= Math.abs(lo)*0.01 || 1; hi += Math.abs(hi)*0.01 || 1; }
  const pad = (hi - lo) * 0.12; lo -= pad; hi += pad;
  const x = i => pts.length === 1 ? W/2 : 4 + i * (W - 8) / (pts.length - 1);
  const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const path = pts.map((p,i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
  const last = pts[pts.length-1], prev = pts.length > 1 ? pts[pts.length-2] : null;
  return `<div class="chart" data-key="${key}"><div class="t"><span class="muted">${label}</span><span><b class="num">${abbr(last.v)}</b> ${prev ? dlt(last.v - prev.v) : ""}</span></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${label} per day">
      <path class="ar" d="${path}L${x(pts.length-1)},${H-B}L${x(0)},${H-B}Z"/><path class="ln" d="${path}" vector-effect="non-scaling-stroke"/>
      ${pts.map((p,i) => `<circle class="pt" cx="${x(i)}" cy="${y(p.v)}" r="3.5" vector-effect="non-scaling-stroke"/>`).join("")}
      <line class="cross" x1="0" x2="0" y1="${T}" y2="${H-B}" style="display:none" vector-effect="non-scaling-stroke"/>
      ${(pts.length > 1 ? [0, pts.length-1] : [0]).map(i => `<text class="ax" x="${x(i)}" y="${H-4}" text-anchor="${i ? "end" : "start"}">${fmtD(pts[i].d)}</text>`).join("")}
    </svg><div class="tip"></div></div>`;
}
function wireCharts(root, hist){
  root.querySelectorAll(".chart").forEach(el => {
    const key = el.dataset.key, svg = el.querySelector("svg"), tip = el.querySelector(".tip"), cross = el.querySelector(".cross");
    const pts = hist.filter(h => h[key] != null);
    const move = e => {
      const r = svg.getBoundingClientRect(), cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
      const i = pts.length === 1 ? 0 : Math.max(0, Math.min(pts.length-1, Math.round((cx/r.width*300 - 4) / (292/(pts.length-1)))));
      const p = pts[i], px = pts.length === 1 ? 150 : 4 + i*292/(pts.length-1);
      cross.setAttribute("x1", px); cross.setAttribute("x2", px); cross.style.display = "";
      tip.innerHTML = `<b>${fmtD(p.date)}</b> · ${key === "power" ? full(p[key]) : abbr(p[key])} ${i ? dlt(p[key] - pts[i-1][key]) : ""}`;
      tip.style.display = "block";
      tip.style.left = Math.min(Math.max(px/300*r.width + 12 - tip.offsetWidth/2, 0), el.clientWidth - tip.offsetWidth) + "px"; tip.style.top = "22px";
    };
    const out = () => { tip.style.display = "none"; cross.style.display = "none"; };
    svg.addEventListener("mousemove", move); svg.addEventListener("touchstart", move, {passive:true});
    svg.addEventListener("touchmove", move, {passive:true}); svg.addEventListener("mouseleave", out);
  });
}

  1:[[B],[U],[H,1],[T],[D,1],[H,1]], 2:[[U],[T],[B,1],[D],[H],[B,1]], 3:[[D,1],[H],[T,1],[B],[U],[T,1]],
  4:[[B],[U],[H,1],[T],[D],[H,1]], 5:[[T,1],[D,1],[U,2],[H],[B,1],[U,2]], 6:[[U],[T],[B],[D],[H],[B]], 0:[[D],[H],[T],[B],[U],[T]],

function phaseStart(dow, ph, from = Date.now()){

let EVENTS = [

];
const CAL_MAP = {"ds-team-a": {key:"ds", name:"Desert Storm", note:"Team A · you're enlisted", href:"#storm"}, "ds-team-b": {skip:true}};
function setCalendar(d){
  const now = Date.now(), to = now + 21 * DAY, out = [];
  (d?.events || []).forEach(e => {
    if (e.low_priority || CAL_MAP[e.id]?.skip) return;   // daily reset is computed locally below; Team B isn't yours
    const s = Date.parse(e.start), step = (e.every_days || 0) * DAY, stop = e.until ? Date.parse(e.until) : Infinity, dur = (e.duration_min || 30) * 6e4;
    let t = s; if (step && t + dur < now) t += Math.ceil((now - dur - t) / step) * step;
    for (; t <= to && t <= stop; t += step || Infinity) {
      if (t + dur < now) continue;
      out.push({key: e.id, name: e.title + (e.tentative ? " (tentative)" : ""), at: isoT(t), end: isoT(t + dur), ic: e.icon || "cal", note: e.notes, ...(CAL_MAP[e.id] || {})});
    }
  });
  if (!out.length) return;
  if (!out.some(e => e.key === "ds")) out.push(EVENTS.find(e => e.key === "ds"));
  EVENTS = out;
}
function upcoming(a){
  const t = a.timers || {}, ev = [];
  const ex = a.extra?.events; (Array.isArray(ex) ? ex : ex?.events || []).forEach(e => e && e.at && ev.push({ic:"cal", ...e}));
  EVENTS.forEach(e => { if (t.season_end && e.key === "s3-end") return; if (!ev.some(x => x.key === e.key && x.at === e.at)) ev.push(e); });
  const ds = a.extra?.desert_storm?.next; if (ds?.start) { const i = ev.findIndex(e => e.key === "ds"); if (i >= 0) ev[i] = {...ev[i], at: ds.start, end: ds.end || ev[i].end}; }
  if (t.season_end) ev.push({name:"Season 3 ends", at:t.season_end, ic:"flag", note:"From the in-game season timer"});
  const s = srv(); ev.push({name:"Daily reset · VS " + VSW[(s.dow + 1) % 7].t, at:isoT(s.start + DAY), ic:"refresh", note:"New VS day and Arms Race start"});
  return ev.filter(e => pd(e.end || e.at) > Date.now() - 60e3).sort((x, y) => pd(x.at) - pd(y.at));
}

  if (c.builders && c.builders[0] < c.builders[1]) L.push({c:"warn", ic:"build", t:`${c.builders[1] - c.builders[0]} builder${c.builders[1] - c.builders[0] > 1 ? "s" : ""} idle`, s:s.dow === 2 ? "It's Base Expansion day: building now scores VS" : "Queue an upgrade (Cooperative Construction helps on long ones)", at:a.updated_at});
  const nr = (C?.inbox || []).filter(t => t.needs_reply).length;
  if (nr) L.push({c:"", ic:"inbox", t:`${nr} conversation${nr > 1 ? "s" : ""} waiting on you`, s:"Groups and DMs where someone else spoke last", href:"#inbox"});
  const H = heroList(a), sq = squadList(a), s1 = sq.find(x => x.squad === 1);
  const stetIn = s1 ? (s1.heroes || []).some(h => /^stet/i.test(h?.name || "")) : null;
  if (stetIn !== true) L.push({c:"hint", ic:"star", t:"Put Stetmann in Squad 1", s:`Celraphina's tip: Stet for damage in the main squad; keep Mason for wanted-boss hits${stetIn === null ? " (squad lineup not read yet)" : ""}`, href:"#heroes"});
  const sc = H.find(h => /^scarlett/i.test(h.name || ""));
  if (sc) L.push({c:"hint", ic:"star", t:sc.stars >= 5 && sc.level >= 150 ? "Scarlett: max her skills next" : "Keep building Scarlett", s:`${sc.stars}★ Lv ${sc.level} now. Celraphina: 5★, max level and maxed skills before UR promotion; she's set to replace Williams`, href:"#heroes"});
  L.push({c:"hint", ic:"gift", t:"Train rides: tap the green Gift Contract button", s:"That's the thank-you for the conductor"});
  const nv = hub.name_vote;
  if (nv && nv.stage !== "Poll open") { const free = (hub.tag_checks?.tags || []).filter(x => x.status === "free").map(x => x.tag);
    L.push({c:"", ic:"flag", t:"Comment a new tag + name idea", s:`On AG's announcement.${free.length ? " Free tags: " + free.join(", ") : ""}`, href:"#alliance"}); }
  const ds = pd(EVENTS.find(e => e.key === "ds").at); const dsd = ds - Date.now();
  if (dsd > 0 && dsd < 4 * DAY) L.push({c:"", ic:"flag", t:"Desert Storm Friday 7 PM", s:"Team A, enlisted. Be online by 6:50 PM", href:"#storm"});
  L.push({c:"ok", ic:"cal", t:`Today is ${VSW[s.dow].t}`, s:"Spend: " + VSW[s.dow].sp, href:"#today"});
  if (s.dow === 3) L.push({c:"hint", ic:"star", t:"Hero day starts at 8 PM tonight", s:"Hero EXP, recruits and shards only from Wed 8 PM to Thu 8 PM"});
  return L;
}

/* ---------- research ---------- */
function researchQueue(rs){
  const at = pd(rs.at);
  return (rs.research_queue || []).map((q, i) => { const m = String(q).match(/(?:(\d+)d\s*)?(\d{1,2}):(\d{2}):(\d{2})/);
    if (m && at) { const sec = ((+(m[1] || 0) * 24 + +m[2]) * 60 + +m[3]) * 60 + +m[4]; return {i, busy:true, done:isoT(+at + sec * 1000)}; }
    return {i, busy: !/idle/i.test(q), done:null}; });
}
function researchCard(a, compact){
  const rs = a.extra?.research;
  if (!rs) return `<section class="card"><div class="ch-h"><h2>${I("flask")}Research</h2>${soon()}</div><div class="ph-box">Appears after the next research read.</div></section>`;
  const T = Object.entries(rs.trees || {}).sort((x, y) => compact ? y[1] - x[1] : 0), Q = researchQueue(rs);
  const avg = T.length ? T.reduce((s, [, v]) => s + v, 0) / T.length : 0, done = T.filter(([, v]) => v >= 100).length;
  return `<section class="card ${rs.idle_slots ? "hot" : ""}"><div class="ch-h"><h2>${I("flask")}Research</h2><span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${rs.idle_slots ? `<span class="pill p-warn">${rs.idle_slots} slot${rs.idle_slots > 1 ? "s" : ""} idle</span>` : `<span class="pill p-good">all slots busy</span>`}${stamp(rs.at)}</span></div>
    <div class="slotrow">${Q.map(q => `<div class="rslot ${q.busy ? "" : "idle"}"><div class="lbl">Slot ${q.i + 1}</div><div class="n">${q.busy ? (q.done ? `<span data-until="${q.done}">${until(q.done)}</span>` : "Busy") : "Idle"}</div><div class="small dim">${q.busy ? (q.done ? "done " + fmtT(q.done) : "researching") : "start something"}</div></div>`).join("")}</div>
    ${compact ? "" : `<div class="kpi" style="margin-top:12px"><div class="mt"><div class="lbl">Trees</div><div class="n num">${T.length}</div></div><div class="mt"><div class="lbl">Complete</div><div class="n num">${done}</div></div><div class="mt"><div class="lbl">Average</div><div class="n num">${Math.round(avg)}%</div></div></div>`}
    <div style="margin-top:10px">${(compact ? T.slice(0, 6) : T).map(([n, v]) => `<div class="rbar"><span class="rn">${esc(n)}</span><div class="rk"><i class="${v >= 100 ? "full" : ""}" style="width:${Math.max(2, Math.min(100, v))}%"></i></div><b class="num">${v}%</b></div>`).join("")}</div>
    ${compact ? `<a class="link" href="#research" style="display:block;margin-top:6px">All ${T.length} trees ›</a>` : ""}</section>`;
}

}

      <div>${th.map(t => { const m = lastMsg(t); return `<div class="th ${cur && cur.id === t.id ? "on" : ""}" data-t="${esc(t.id)}">${icon(t)}

function convo(t){

    const d = pd(m.at), day = d ? fmtDay(d) : "";
    const sep = day && day !== lastDay ? `<div class="daysep">${day}</div>` : ""; if (day) lastDay = day;
    const tm = d && /[ T]\d{1,2}:\d\d/.test(m.at || "") ? " · " + (m.approx ? "~" : "") + d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}) : "";
    return sep + `<div class="msg ${m.me ? "me" : ""}"><div class="who">${esc(m.me ? "You" : m.who || "")}${tm}</div>
      <div class="bb">${m.reply ? `<div class="q">↪ ${esc(m.reply)}</div>` : ""}${esc(m.text)}${m.en ? `<div class="en">${esc(m.en)}</div>` : ""}</div></div>`;
  }).join("");
  const posts = (t.your_posts || []).length ? `<details class="more" style="margin-bottom:10px"><summary>Your recent World questions</summary><ul class="starters">${t.your_posts.map(p => `<li>${esc(p.text)} <span class="dim small">${ago(p.at)}</span></li>`).join("")}</ul></details>` : "";

    <span style="display:flex;gap:8px;align-items:center">${t.needs_reply ? `<span class="pill p-acc">needs reply</span>` : `<span class="pill p-good">caught up</span>`}
    ${t.kind !== "channel" ? `<button class="btn" id="replyto" data-to="${esc(t.person || t.label)}" style="padding:7px 12px">Reply…</button>` : ""}</span></div>
    ${posts}<div class="convo">${ms || `<div class="empty">No messages.</div>`}</div>
    <div class="small dim" style="margin-top:8px">${t.count} messages${t.count > (t.messages || []).length ? `, latest ${(t.messages || []).length} shown` : ""}</div>`;
}
function wireInbox(){
  document.querySelectorAll("[data-if]").forEach(b => b.onclick = () => { UI.ifilter = b.dataset.if; render(); });
  document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { UI.thread = b.dataset.t; render(); if (innerWidth <= 900) document.querySelector(".convc")?.scrollIntoView(); });
  const bk = document.getElementById("back"); if (bk) bk.onclick = () => { UI.thread = null; render(); };
  const ta = document.getElementById("req"), sel = document.getElementById("reqto");

  if (rt) rt.onclick = () => { const to = rt.dataset.to;
    if ([...sel.options].some(o => o.value === to)) { sel.value = to; UI.draftTo = to; }
    ta.value = UI.draft = `Reply to ${to}: `; ta.focus(); ta.scrollIntoView({behavior:"smooth", block:"center"}); };
  const send = document.getElementById("sendreq");
  send.onclick = async () => {
    const text = ta.value.trim(); if (!text) { toast("Type a request first"); return; }
    send.disabled = true; document.getElementById("reqmsg").textContent = "Sending…";
    try {
      const r = await fetch(BASE + "/inbox", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({c: code, text, to: sel.value})});

    } catch (e) { send.disabled = false; document.getElementById("reqmsg").textContent = "Couldn't send: " + e.message; }
  };
}

const bucket = m => m.days_since_seen == null ? "unknown" : m.inactive_3d || m.days_since_seen >= 3 ? "inactive" : m.days_since_seen >= 1 ? "quiet" : "active";
const seenTxt = m => m.last_seen_at ? ago(m.last_seen_at) : (m.last_seen || "–");
function actLine(x){
  if (!x) return "";
  const b = bucket(x), pill = {active:["Active","p-good"], quiet:["Quiet 1–3 days","p-warn"], inactive:["Inactive 3+ days","p-bad"], unknown:["No reading","p-mute"]}[b];
  return `<div class="actl"><span class="lbl">Activity</span>${sbar(x.activity_score)}<span>last seen ${esc(seenTxt(x))}</span>

const RK = () => acct().extra?.alliance_rankings || null;
// colour follows the alliance, never its rank; 12AM wears the page accent
const SCOL = {"12AM":"var(--accent)", RGBB:"#c98500", PNXX:"#199e70", DOc:"#9085e9", WW26:"#3987e5", StWb:"#d55181", "0FNA":"#2fa52f", Bkd:"#9aa3af", Ddi:"#6b7480"};
const scol = t => SCOL[t] || "#6b7480";
const SRC = {game:"in-game alliance screen", map:"map tracker alliance export", report:"daily server report"};
const rkOwn = K => (K.top || []).find(r => r.tag === K.own_tag);
function rkGaps(K){
  const top = K.top || [], i = top.findIndex(r => r.tag === K.own_tag);
  if (i < 0) return {};
  return {me: top[i], above: top[i-1] || null, below: top[i+1] || null};
}
function rkGrowth(K, tag){
  const s = K.series?.[tag]; if (!s) return null;
  const pts = s.pts.filter(p => !p.est); if (pts.length < 2) return null;
  return {d: pts[pts.length-1].p - pts[0].p, since: pts[0].t};
}
function rankSnap(){
  const K = RK(); if (!K || !(K.top || []).length) return "";
  const {me, above, below} = rkGaps(K);
  const top5 = K.top.slice(0, 5), inTop = top5.some(r => r.tag === K.own_tag);
  const li = r => `<li class="${r.tag === K.own_tag ? "me" : ""}"><span class="r">${r.rank}</span><span class="sw" style="width:9px;height:9px;border-radius:3px;background:${scol(r.tag)}"></span><span class="t"><b>[${esc(r.tag)}]</b> <span class="muted">${esc(r.name || "")}</span></span><b class="num">${abbr(r.power)}</b></li>`;
  return `<section class="card"><div class="ch-h"><h2>${I("trophy")}Server rankings</h2><a class="link" href="#rankings">Full rankings ›</a></div>
    ${me ? `<div class="rk-hero"><div class="big num">#${me.rank}<small>on #${esc(K.server)}</small></div><div class="small muted" style="padding-bottom:4px">[${esc(me.tag)}] ${abbr(me.power)} total power</div></div>
    <div class="small" style="margin-top:8px">${above ? `<span class="down">${abbr(above.power - me.power)}</span> behind #${above.rank} [${esc(above.tag)}]` : "Top of the server"}${below ? ` · <span class="up">${abbr(me.power - below.power)}</span> ahead of #${below.rank} [${esc(below.tag)}]` : ""}</div>` : ""}
    <ul class="rkmini">${top5.map(li).join("")}${!inTop && me ? li(me) : ""}</ul>
    <div class="small dim" style="margin-top:8px">Leaderboard read ${K.as_of ? ago(K.as_of) : "—"}</div></section>`;
}
function rankingsPage(){
  const K = RK();
  if (!K || !(K.top || []).length) return `<section class="card empty">No leaderboard readings yet.</section>`;
  const {me, above, below} = rkGaps(K), g = me && rkGrowth(K, me.tag);
  const tags = Object.keys(K.series || {});
  if (!UI.rkOn) UI.rkOn = K.top.slice(0, 6).map(r => r.tag).concat(K.top.slice(0, 8).some(r => r.tag === K.own_tag) ? [] : [K.own_tag]);
  const chipTags = [...new Set(K.top.slice(0, 8).map(r => r.tag).concat([K.own_tag], tags.includes("Ddi") ? ["Ddi"] : []))].filter(t => K.series?.[t]);
  const first = Object.values(K.series || {}).map(s => s.first).sort()[0];
  const rows = K.top.map((r, i) => { const up = K.top[i-1], dn = K.top[i+1], gr = rkGrowth(K, r.tag);
    return `<tr class="${r.tag === K.own_tag ? "me" : ""}"><td>${r.rank}</td><td class="al" title="${esc(r.name || "")}"><span class="sw" style="background:${scol(r.tag)}"></span><span class="tg">[${esc(r.tag)}]</span> ${esc(r.name || "")}</td>
      <td>${full(r.power)}</td><td>${up ? `<span class="down">−${abbr(up.power - r.power)}</span>` : "–"}</td><td class="hide-s">${dn ? `<span class="up">+${abbr(r.power - dn.power)}</span>` : "–"}</td>
      <td class="hide-s">${gr ? `${dlt(gr.d)} <span class="dim">since ${esc(fmtD(gr.since.slice(0, 10)))}</span>` : `<span class="dim">–</span>`}</td>
      <td class="hide-s">${r.members != null ? `${r.members}/${r.cap || 100}` : "–"}</td><td class="hide-s" style="text-align:left">${esc(r.leader || "–")}</td></tr>`; }).join("");
  return `<section class="card hot"><div class="ch-h"><span class="lbl">Our place on server #${esc(K.server)}</span><span class="small dim">Leaderboard read ${K.as_of ? `${fmtT(K.as_of)} (${ago(K.as_of)})` : "—"}</span></div>
      ${me ? `<div class="rk-hero"><div class="big num">#${me.rank}<small>of ${K.top.length}+ alliances</small></div><div style="padding-bottom:4px"><b>[${esc(me.tag)}] ${esc(me.name || "")}</b><div class="small muted num">${full(me.power)} total power</div></div></div>
      <div class="rk-gaps"><div class="mt"><div class="lbl">Gap to #${above ? above.rank : "–"} ${above ? "[" + esc(above.tag) + "]" : ""}</div><div class="n num ${above ? "down" : ""}">${above ? "−" + abbr(above.power - me.power) : "Top"}</div></div>
        <div class="mt"><div class="lbl">Lead over #${below ? below.rank : "–"} ${below ? "[" + esc(below.tag) + "]" : ""}</div><div class="n num ${below ? "up" : ""}">${below ? "+" + abbr(me.power - below.power) : "–"}</div></div>
        <div class="mt"><div class="lbl">Growth since ${g ? esc(fmtD(g.since.slice(0, 10))) : "first reading"}</div><div class="n num">${g ? dlt(g.d) : "–"}</div></div></div>` : ""}</section>
    <section class="card"><div class="ch-h"><h2>${I("pulse")}Total power over time</h2><span class="small dim">Tap a line's name to show or hide it</span></div>
      <div class="schips">${chipTags.map(t => `<button class="schip ${UI.rkOn.includes(t) ? "on" : ""}" data-rk="${esc(t)}"><i style="background:${scol(t)}"></i>${esc(t)}${t === "Ddi" ? " (old)" : ""}</button>`).join("")}</div>
      <div class="pchart" id="rkchart"></div>
      <div class="legend-note"><span><svg viewBox="0 0 30 10"><line x1="0" y1="5" x2="30" y2="5" stroke="currentColor" stroke-width="2"/><circle cx="15" cy="5" r="3.5" fill="currentColor"/></svg>reading</span>
        <span><svg viewBox="0 0 30 10"><circle cx="15" cy="5" r="3.5" fill="var(--card)" stroke="currentColor" stroke-width="1.6"/></svg>rounded estimate</span></div>
      <p class="small muted" style="margin:10px 0 0">Daily leaderboard tracking began ${K.tracking_since ? esc(fmtD(K.tracking_since.slice(0, 10))) : "recently"}. Earlier points${first ? ` (back to ${esc(fmtD(first.slice(0, 10)))})` : ""} come from saved alliance screens and a map tracker's alliance export, so they're sparse and some alliances have only one or two. Lines just join readings; they don't show what happened in between.</p></section>
    <section class="card"><div class="ch-h"><h2>${I("trophy")}Top alliances</h2><span class="small dim">Alliance Power leaderboard</span></div>
      <div class="tbl"><table class="rkt"><tr><th>#</th><th style="text-align:left">Alliance</th><th>Power</th><th>To rank above</th><th class="hide-s">Over rank below</th><th class="hide-s">Growth</th><th class="hide-s">Members</th><th class="hide-s" style="text-align:left">Leader</th></tr>${rows}</table></div>
      <div class="small dim" style="margin-top:8px">Members and leader are read for the top 8. The game notes its leaderboard updates with a delay.</div></section>`;
}
function rkChart(el, K){
  const on = UI.rkOn.filter(t => K.series?.[t]);
  const W = Math.max(300, el.clientWidth), H = W < 520 ? 240 : 300, L = 30, R = 44, T = 14, B = 24;
  const ser = on.map(t => ({t, pts: K.series[t].pts.map(p => ({...p, d: pd(p.t)})).filter(p => p.d)}));
  const all = ser.flatMap(s => s.pts);
  if (!all.length) { el.innerHTML = `<div class="empty">Pick an alliance above.</div>`; return; }
  let x0 = Math.min(...all.map(p => +p.d)), x1 = Math.max(...all.map(p => +p.d));
  if (x1 - x0 < 864e5) { x0 -= 432e5; x1 += 432e5; }
  let lo = Math.min(...all.map(p => p.p)), hi = Math.max(...all.map(p => p.p));
  const pad = (hi - lo) * 0.08 || hi * 0.05; lo = Math.max(0, lo - pad); hi += pad;
  const X = d => L + (d - x0) / (x1 - x0) * (W - L - R), Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const step = [1e9, 2e9, 5e9, 1e10].find(s => (hi - lo) / s <= 5) || 2e10;
  const ticks = []; for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) ticks.push(v);
  const days = []; for (let d = new Date(x0); d <= x1; d = new Date(+d + 864e5)) { const m = new Date(d); m.setHours(0, 0, 0, 0); if (+m >= x0) days.push(m); }
  const every = Math.ceil(days.length / (W < 520 ? 4 : 8));
  const lines = ser.map(s => { const c = scol(s.t), me = s.t === K.own_tag; let out = "";
    const real = s.pts.filter(p => !p.est);   // the line joins real readings only; rounded estimates stay loose dots
    if (real.length > 1) out += `<polyline points="${real.map(p => `${X(p.d).toFixed(1)},${Y(p.p).toFixed(1)}`).join(" ")}" fill="none" stroke="${c}" stroke-width="${me ? 3 : 2}" stroke-linejoin="round" stroke-linecap="round"/>`;
    out += s.pts.map(p => `<circle cx="${X(p.d)}" cy="${Y(p.p)}" r="${me ? 4.5 : 4}" fill="${p.est ? "var(--card)" : c}" stroke="${p.est ? c : "var(--card)"}" stroke-width="${p.est ? 1.8 : 2}"/>`).join("");
    return out; }).join("");
  // end labels, nudged apart so they don't collide
  const labs = ser.filter(s => s.pts.length).map(s => { const p = s.pts[s.pts.length-1]; return {t: s.t, x: X(p.d), y: Y(p.p)}; }).sort((a, b) => a.y - b.y);
  for (let i = 1; i < labs.length; i++) if (labs[i].y - labs[i-1].y < 13) labs[i].y = labs[i-1].y + 13;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Total alliance power over time">
    ${ticks.map(v => `<line class="gl" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="0" y="${Y(v) - 4}">${abbr(v)}</text>`).join("")}
    ${days.filter((_, i) => i % every === 0).map(d => `<text class="ax" x="${X(+d)}" y="${H - 6}" text-anchor="middle">${d.toLocaleDateString([], {month:"short", day:"numeric"})}</text>`).join("")}
    <line class="cross" y1="${T}" y2="${H - B}" style="display:none"/>
    ${lines}
    ${labs.map(l => `<text class="lb ${l.t === K.own_tag ? "me" : ""}" x="${Math.min(l.x + 7, W - R + 4)}" y="${l.y + 4}">${esc(l.t)}</text>`).join("")}
    <rect x="0" y="0" width="${W}" height="${H}" fill="transparent" class="hit"/></svg><div class="tip"></div>`;
  const svg = el.querySelector("svg"), tip = el.querySelector(".tip"), cross = el.querySelector(".cross");
  const flat = ser.flatMap(s => s.pts.map(p => ({...p, tag: s.t, x: X(p.d), y: Y(p.p)})));
  const move = e => {
    const r = svg.getBoundingClientRect(), ev = e.touches ? e.touches[0] : e;
    const mx = (ev.clientX - r.left) * W / r.width, my = (ev.clientY - r.top) * H / r.height;
    const p = flat.reduce((b, q) => { const d = Math.hypot(q.x - mx, (q.y - my) * 0.6); return d < b.d ? {d, q} : b; }, {d: 1e9}).q;
    if (!p) return;
    cross.setAttribute("x1", p.x); cross.setAttribute("x2", p.x); cross.style.display = "";
    const nm = K.series[p.tag]?.name || "";
    tip.innerHTML = `<b>[${esc(p.tag)}]</b> ${esc(nm)}<br><b class="num">${p.est ? "≈ " + abbr(p.p) : full(p.p)}</b>${p.m ? ` · ${p.m} members` : ""}<br><span class="dim">${esc(fmtDay(p.d))} ${p.d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"})} · ${esc(SRC[p.src] || "")}${p.est ? " (rounded)" : ""}</span>`;
    tip.style.display = "block";
    const px = p.x / W * r.width;
    tip.style.left = Math.min(Math.max(px - tip.offsetWidth / 2, 0), el.clientWidth - tip.offsetWidth) + "px";
    tip.style.top = Math.max(0, p.y / H * r.height - tip.offsetHeight - 12) + "px";
  };
  const out = () => { tip.style.display = "none"; cross.style.display = "none"; };
  svg.addEventListener("mousemove", move); svg.addEventListener("touchstart", move, {passive:true});
  svg.addEventListener("touchmove", move, {passive:true}); svg.addEventListener("mouseleave", out);
}
function wireRankings(){
  const K = RK(), el = document.getElementById("rkchart"); if (!K || !el) return;
  rkChart(el, K);
  document.querySelectorAll("[data-rk]").forEach(b => b.onclick = () => {
    const t = b.dataset.rk; UI.rkOn = UI.rkOn.includes(t) ? UI.rkOn.filter(x => x !== t) : UI.rkOn.concat(t);
    b.classList.toggle("on"); rkChart(el, K); });
  clearTimeout(wireRankings.t);
  window.onresize = () => { clearTimeout(wireRankings.t); wireRankings.t = setTimeout(() => { const e = document.getElementById("rkchart"); if (e) rkChart(e, RK()); }, 150); };
}

/* ---------- activity ---------- */
function activity(){
  const a = acct(), act = a.activity || [];
  const cats = [...new Set(act.map(x => x.cat))];
  const list = act.filter(x => (UI.acat === "all" || x.cat === UI.acat) && (UI.afilter === "all" || x.status === UI.afilter));
  const ic = {Combat:"sword", Resources:"wheat", "Train/Build":"hammer", Events:"cal"};
  return `${last24Card(a)}
    <section class="card"><div class="ch-h"><h2>${I("pulse")}Recent Activity</h2><span class="small dim">${act.length} actions in the last 24h</span></div>
    <div class="toolbar"><select class="sel" id="acat"><option value="all">All categories</option>${cats.map(c => `<option ${UI.acat === c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>
      <select class="sel" id="afil">${[["all","All statuses"],["done","Completed"],["idle","Nothing to do"],["attention","Needs a look"]].map(([v, l]) => `<option value="${v}" ${UI.afilter === v ? "selected" : ""}>${l}</option>`).join("")}</select></div>
    <ul class="rows">${list.map(x => `<li><span class="ri">${I(ic[x.cat] || "check")}</span><span class="rt"><b>${esc(x.task)}</b><div class="s">${esc(x.outcome)}</div></span>
      <span style="text-align:right">${stPill(x.status)}<div class="small dim" style="margin-top:3px">${ago(x.at)}</div></span></li>`).join("") || `<li class="empty">Nothing matches.</li>`}</ul></section>
    ${R.length ? `<section class="card"><div class="ch-h"><h2>${I("send")}Your requests</h2><a class="link" href="#inbox">New request ›</a></div>${R.slice(0, 10).map(reqRow).join("")}</section>` : ""}`;
}
function wireActivity(){
  document.getElementById("acat").onchange = e => { UI.acat = e.target.value; render(); };
  document.getElementById("afil").onchange = e => { UI.afilter = e.target.value; render(); };
}

setInterval(() => document.querySelectorAll("[data-until]").forEach(el => el.textContent = until(el.dataset.until)), 1000);
setInterval(() => { if (S && !document.hidden && !document.activeElement?.matches("textarea,input,select")) load(); }, 5 * 60000);
load();
</script>
