<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account Tracker</title>
<style>
:root{
  color-scheme: dark light;
  --page:#0d1117; --surface:#161b22; --surface-2:#1c2330; --ink:#e6edf3; --ink-2:#8b949e; --ink-3:#6e7681;
  --hair:#30363d; --accent:#f0a020; --line:#58a6ff;
  --good:#3fb950; --warn:#e3a008; --bad:#f85149;
}
@media (prefers-color-scheme: light){
  :root{ --page:#f4f4f1; --surface:#ffffff; --surface-2:#f7f6f2; --ink:#12110f; --ink-2:#5c5a54; --ink-3:#8a887f;
    --hair:#e1dfd7; --accent:#b86e00; --line:#2a78d6; --good:#1f8f3a; --warn:#b07800; --bad:#c93030; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
button,input{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:22px;margin:0}
.muted{color:var(--ink-2)} .small{font-size:12.5px}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:16px;margin-bottom:16px}
.id{display:flex;gap:14px;align-items:center}
.av{width:64px;height:64px;border-radius:14px;object-fit:cover;border:1px solid var(--hair);background:var(--surface-2);flex:none}
.id h2{margin:0;font-size:20px;word-break:break-word}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--hair);color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.dot.good{background:var(--good)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
.status{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:12px}
.hero{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin:18px 0 6px}
.hero .big{font-size:34px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.delta{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--ink-2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.tile{background:var(--surface-2);border:1px solid var(--hair);border-radius:12px;padding:10px 12px;min-width:0}
.tile .k{font-size:12px;color:var(--ink-2)}
.tile .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.tile .s{font-size:12px;color:var(--ink-2);margin-top:2px}
h3{font-size:15px;margin:22px 0 8px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
ul.list{list-style:none;margin:0;padding:0}
ul.list li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--hair);font-size:14px}
ul.list li:last-child{border-bottom:0}
.when{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.when .cd{font-weight:700}
.st{display:inline-flex;gap:8px;align-items:center;min-width:0}
.ic{width:18px;height:18px;flex:none;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff}
.ic.done{background:var(--good)} .ic.partial,.ic.waiting{background:var(--warn)} .ic.attention{background:var(--bad)}
.ic.todo{background:transparent;border:2px solid var(--ink-3)}
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.ch{background:var(--surface-2);border:1px solid var(--hair);border-radius:12px;padding:10px 12px;position:relative;min-width:0}
.ch .t{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.ch .t b{font-weight:700}
.ch svg{display:block;width:100%;height:110px;margin-top:6px;overflow:visible}
.ch .ax{font-size:10px;fill:var(--ink-3)}
.ch .grid{stroke:var(--hair);stroke-width:1}
.ch .ln{fill:none;stroke:var(--line);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ch .pt{fill:var(--line);stroke:var(--surface-2);stroke-width:2}
.ch .cross{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--hair);border-radius:8px;padding:5px 8px;font-size:12px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.25);display:none;z-index:2}
details{margin-top:10px} summary{cursor:pointer;color:var(--ink-2);font-size:13px}
.tbl{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;width:100%}
th,td{padding:5px 8px;border-bottom:1px solid var(--hair);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--ink-2);font-weight:600}
.gate{max-width:360px;margin:12vh auto;text-align:center}
.gate input{width:100%;padding:12px;border:1px solid var(--hair);border-radius:10px;background:var(--surface);text-align:center;letter-spacing:2px;text-transform:uppercase;margin:14px 0 8px}
.gate button,.btn{padding:11px 18px;border-radius:10px;border:0;background:var(--accent);color:#000;font-weight:700;cursor:pointer}
.err{color:var(--bad);font-size:13px;min-height:18px}
</style>
</head>
<body>
<div id="app" class="wrap"><p class="muted">Loading…</p></div>
<script>
const API = "https://emj-upload.bullochman.workers.dev/acct/state";
const ls = { get(k){ try { return localStorage.getItem(k); } catch { return null; } },
             set(k,v){ try { localStorage.setItem(k,v); } catch {} } };
const url = new URL(location.href);
let code = url.searchParams.get("c") || ls.get("lwd_code") || "";
if (url.searchParams.get("c")) ls.set("lwd_code", code);
let DATA = null;
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const LABEL = {power:"Power", food:"Food", iron:"Iron", coin:"Coin", oil:"Oil", diamonds:"Diamonds", stars:"★ Tokens", stamina:"Stamina"};
const CHARTS = ["power","food","iron","coin","oil","diamonds","stars","stamina"];

function abbr(n){
  if (n == null) return "–";
  const a = Math.abs(n);
  if (a >= 1e9) return (n/1e9).toFixed(a >= 1e10 ? 1 : 2).replace(/\.?0+$/,"") + "G";
  if (a >= 1e6) return (n/1e6).toFixed(1).replace(/\.0$/,"") + "M";
  if (a >= 1e4) return (n/1e3).toFixed(1).replace(/\.0$/,"") + "K";
  return n.toLocaleString();
}
const full = n => n == null ? "–" : n.toLocaleString();
const fmtT = iso => new Date(iso).toLocaleString([], {weekday:"short", hour:"numeric", minute:"2-digit"});
const fmtD = d => new Date(d + "T12:00:00").toLocaleDateString([], {month:"short", day:"numeric"});
function ago(iso){
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "just now"; if (m < 60) return m + "m ago";
  const h = Math.floor(m/60); if (h < 48) return h + "h " + (m%60) + "m ago";
  return Math.floor(h/24) + "d ago";
}
function until(iso){
  let s = Math.round((new Date(iso) - Date.now()) / 1000);
  if (s <= 0) return "now";
  const d = Math.floor(s/86400); s %= 86400;
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60);
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`;
}
function delta(cur, prev){
  if (cur == null || prev == null) return "";
  const d = cur - prev, cls = d > 0 ? "up" : d < 0 ? "down" : "flat";
  const pct = prev ? ` (${(d/prev*100).toFixed(2)}%)` : "";
  return `<span class="delta ${cls}">${d > 0 ? "+" : d < 0 ? "−" : "±"}${abbr(Math.abs(d))}${pct}</span>`;
}

async function load(){
  if (!code) return gate("");
  let r;
  try { r = await fetch(API + "?c=" + encodeURIComponent(code), {cache:"no-store"}); }
  catch { return gate("Couldn't reach the server. Try again."); }
  if (r.status === 403) return gate("That access code didn't work.");
  if (!r.ok) return gate("Not available right now.");
  DATA = await r.json();
  render();
}

function gate(msg){
  app.innerHTML = `<div class="gate card"><h1>Account Tracker</h1>
    <p class="muted small">Enter the access code.</p>
    <input id="code" autocomplete="off" autocapitalize="characters" value="${esc(code)}">
    <div class="err">${esc(msg)}</div>
    <button id="go">Open</button></div>`;
  const go = () => { code = document.getElementById("code").value.trim(); ls.set("lwd_code", code); load(); };
  document.getElementById("go").onclick = go;
  document.getElementById("code").onkeydown = e => { if (e.key === "Enter") go(); };
}

function freshness(iso){
  if (!iso) return "bad";
  const h = (Date.now() - new Date(iso)) / 3.6e6;
  return h < 3 ? "good" : h < 12 ? "warn" : "bad";
}

function chart(hist, key){
  const pts = hist.filter(h => h[key] != null).map(h => ({d:h.date, v:h[key]}));
  if (!pts.length) return "";
  const W = 300, H = 110, L = 4, R = 4, T = 8, B = 18;
  const vs = pts.map(p => p.v);
  let lo = Math.min(...vs), hi = Math.max(...vs);
  if (lo === hi){ lo -= Math.abs(lo)*0.01 || 1; hi += Math.abs(hi)*0.01 || 1; }
  const pad = (hi - lo) * 0.12; lo -= pad; hi += pad;
  const x = i => pts.length === 1 ? W/2 : L + i * (W - L - R) / (pts.length - 1);
  const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const path = pts.map((p,i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
  const last = pts[pts.length-1], prev = pts.length > 1 ? pts[pts.length-2] : null;
  const ticks = pts.length > 1 ? [0, pts.length-1] : [0];
  return `<div class="ch" data-key="${key}">
    <div class="t"><span>${LABEL[key]}</span><span><b>${abbr(last.v)}</b> ${prev ? delta(last.v, prev.v) : ""}</span></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${LABEL[key]} per day">
      <line class="grid" x1="0" x2="${W}" y1="${H-B}" y2="${H-B}"/>
      <path class="ln" d="${path}" vector-effect="non-scaling-stroke"/>
      ${pts.map((p,i) => `<circle class="pt" cx="${x(i)}" cy="${y(p.v)}" r="4" vector-effect="non-scaling-stroke"/>`).join("")}
      <line class="cross" x1="0" x2="0" y1="${T}" y2="${H-B}" style="display:none" vector-effect="non-scaling-stroke"/>
      ${ticks.map(i => `<text class="ax" x="${x(i)}" y="${H-4}" text-anchor="${i ? "end" : "start"}">${fmtD(pts[i].d)}</text>`).join("")}
    </svg><div class="tip"></div></div>`;
}

function wireCharts(root, hist){
  root.querySelectorAll(".ch").forEach(el => {
    const key = el.dataset.key, svg = el.querySelector("svg"), tip = el.querySelector(".tip"), cross = el.querySelector(".cross");
    const pts = hist.filter(h => h[key] != null);
    const move = e => {
      const r = svg.getBoundingClientRect(), cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
      const i = pts.length === 1 ? 0 : Math.max(0, Math.min(pts.length-1, Math.round((cx/r.width*300 - 4) / (292/(pts.length-1)))));
      const p = pts[i], px = pts.length === 1 ? 150 : 4 + i*292/(pts.length-1);
      cross.setAttribute("x1", px); cross.setAttribute("x2", px); cross.style.display = "";
      const prev = i ? pts[i-1][key] : null;
      tip.innerHTML = `<b>${fmtD(p.date)}</b> · ${key === "power" ? full(p[key]) : abbr(p[key])} ${prev != null ? delta(p[key], prev) : ""}`;
      tip.style.display = "block";
      const left = Math.min(Math.max(px/300*r.width + 12 - tip.offsetWidth/2, 0), el.clientWidth - tip.offsetWidth);
      tip.style.left = left + "px"; tip.style.top = "22px";
    };
    const out = () => { tip.style.display = "none"; cross.style.display = "none"; };
    svg.addEventListener("mousemove", move); svg.addEventListener("touchstart", move, {passive:true});
    svg.addEventListener("touchmove", move, {passive:true}); svg.addEventListener("mouseleave", out);
  });
}

function upcoming(a){
  const ev = [];
  if (a.today && a.today.reset_at) ev.push(["Daily reset", a.today.reset_at]);
  const t = a.timers || {};
  if (t.stamina_cap) ev.push(["Stamina reaches 120", t.stamina_cap]);
  if (t.season_end) ev.push(["Season ends", t.season_end]);
  ((a.queue && a.queue.items) || []).forEach(q => ev.push([`${q.name} → Lv.${q.to_level}`, q.done_at]));
  (a.today?.items || []).filter(i => i.status === "waiting" && i.ready_at).forEach(i => ev.push([i.label, i.ready_at]));
  ev.sort((x, y) => new Date(x[1]) - new Date(y[1]));
  return ev;
}

function accountCard(a){
  const c = a.current || {}, h = a.history || [];
  const prevDay = h.length > 1 ? h[h.length-2] : null;
  const week = h.filter(x => x.power != null);
  const wk = week.length > 1 ? week[Math.max(0, week.length-8)] : null;
  const fr = freshness(a.updated_at);
  const tiles = [
    ["Food", abbr(c.food)], ["Iron", abbr(c.iron)], ["Coin", abbr(c.coin)], ["Oil", abbr(c.oil)],
    ["Diamonds", full(c.diamonds)], ["★ Tokens", abbr(c.stars)],
    ["Stamina", c.stamina ?? "–", c.stamina != null ? (c.stamina >= 120 ? "full — spend it" : a.timers?.stamina_cap ? "120 at " + fmtT(a.timers.stamina_cap) : "") : ""],
    ["Builders busy", c.builders ? c.builders.join(" / ") : "–", c.builders && c.builders[0] < c.builders[1] ? "a builder is idle" : ""],
    ["Research", c.research ? c.research.join(" / ") : "–"],
  ];
  const ev = upcoming(a);
  const done = (a.today?.items || []).filter(i => i.status === "done").length, tot = (a.today?.items || []).length;
  const icon = s => `<span class="ic ${s}">${s === "done" ? "✓" : s === "attention" ? "!" : s === "todo" ? "" : "…"}</span>`;
  return `<section class="card">
    <div class="id">
      ${a.avatar ? `<img class="av" src="${a.avatar}" alt="">` : `<div class="av"></div>`}
      <div style="min-width:0"><h2>${esc(a.name)}</h2>
        <div class="chips"><span class="chip">WZ ${esc(a.warzone)}</span><span class="chip">${esc(a.alliance)}</span>
          ${a.level ? `<span class="chip">HQ ${a.level}</span>` : ""}${a.rank ? `<span class="chip" title="roster ${esc(a.rank.as_of)}">${esc(a.rank.rank)}</span>` : ""}</div></div>
    </div>
    <div class="status">
      <span class="pill"><span class="dot ${fr}"></span>Data ${a.updated_at ? ago(a.updated_at) : "—"}</span>
      ${a.last_signin ? `<span class="pill">Last sign-in ${ago(a.last_signin)} · ${fmtT(a.last_signin)}</span>` : ""}
    </div>
    <div class="hero"><div><div class="muted small">Total power</div><div class="big">${full(c.power)}</div></div>
      <div class="small">${prevDay ? `vs yesterday ${delta(c.power, prevDay.power)}<br>` : ""}${wk ? `since ${fmtD(wk.date)} ${delta(c.power, wk.power)}` : ""}</div></div>
    <div class="tiles">${tiles.map(t => `<div class="tile"><div class="k">${t[0]}</div><div class="v">${t[1]}</div>${t[2] ? `<div class="s">${t[2]}</div>` : ""}</div>`).join("")}</div>
    <div class="cols">
      <div><h3>Coming up</h3><ul class="list">${ev.map(e => `<li><span>${esc(e[0])}</span><span class="when"><span class="cd" data-until="${e[1]}">${until(e[1])}</span><br><span class="muted small">${fmtT(e[1])}</span></span></li>`).join("") || `<li class="muted">Nothing scheduled</li>`}</ul>
        ${a.queue ? `<div class="muted small" style="margin-top:6px">Build queue as of ${fmtT(a.queue.seen_at)}</div>` : ""}</div>
      ${a.today ? `<div><h3>Today's checklist <span class="muted small">${done}/${tot} done · resets ${fmtT(a.today.reset_at)}</span></h3>
        <ul class="list">${a.today.items.map(i => `<li><span class="st">${icon(i.status)}${esc(i.label)}</span><span class="muted small when">${esc(i.detail || (i.status === "todo" ? "not yet" : ""))}</span></li>`).join("")}</ul></div>` : ""}
    </div>
    <h3>Day by day</h3>
    <div class="charts">${CHARTS.map(k => chart(h, k)).join("")}</div>
    <details><summary>Table view</summary><div class="tbl"><table>
      <tr><th>Date</th>${CHARTS.map(k => `<th>${LABEL[k]}</th>`).join("")}</tr>
      ${h.slice().reverse().map(r => `<tr><td>${fmtD(r.date)}</td>${CHARTS.map(k => `<td>${k === "power" ? full(r[k]) : k === "diamonds" || k === "stamina" ? full(r[k]) : abbr(r[k])}</td>`).join("")}</tr>`).join("")}
    </table></div></details>
  </section>`;
}

function render(){
  const accts = DATA.accounts || [];
  app.innerHTML = `<header class="top"><h1>Account Tracker</h1>
    <span class="muted small">Published ${DATA.generated_at ? ago(DATA.generated_at) : "—"} · ${accts.length} account${accts.length === 1 ? "" : "s"}</span></header>
    ${accts.map(accountCard).join("")}`;
  app.querySelectorAll("section.card").forEach((el, i) => wireCharts(el, accts[i].history || []));
}

setInterval(() => document.querySelectorAll("[data-until]").forEach(el => el.textContent = until(el.dataset.until)), 30000);
setInterval(() => { if (DATA && !document.hidden) load(); }, 5 * 60000);
load();
</script>
</body>
</html>
